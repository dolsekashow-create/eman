<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>لوحة التحكم | Eman Warsaw</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
:root { --gold:#B89B5E; --gold-lt:#D4BC82; --gold-dk:#8C7340; --black:#0E0E0E; --dark:#1a1a1a; --darker:#0a0a0a; --white:#fff; --border:rgba(255,255,255,0.08); --success:#4caf50; --danger:#f44336; --warn:#ff9800; }
html, body { height:100%; }
body { font-family:'Cairo',sans-serif; background:var(--darker); color:var(--white); direction:rtl; line-height:1.7; font-size:14px; }
button { font-family:inherit; cursor:pointer; border:none; }
input, textarea, select { font-family:inherit; }

#loginWrap { position:fixed; inset:0; z-index:10000; display:flex; align-items:center; justify-content:center; background:radial-gradient(circle at center, #1a1a1a 0%, #050505 100%); }
.login-box { background:var(--dark); padding:40px 36px; border:1px solid var(--border); border-top:3px solid var(--gold); width:100%; max-width:360px; box-shadow:0 20px 60px rgba(0,0,0,0.6); }
.login-logo { text-align:center; margin-bottom:24px; color:var(--gold); letter-spacing:3px; font-weight:700; font-size:1.1rem; }
.login-logo span { display:block; font-weight:300; font-size:0.72rem; letter-spacing:1.5px; color:rgba(255,255,255,0.4); margin-top:4px; }
.login-box h2 { font-size:1.1rem; font-weight:600; margin-bottom:24px; text-align:center; color:rgba(255,255,255,0.85); }
.login-box label { display:block; font-size:0.8rem; color:rgba(255,255,255,0.6); margin-bottom:6px; }
.login-box input { width:100%; padding:11px 14px; background:#0f0f0f; border:1px solid var(--border); color:var(--white); margin-bottom:14px; font-size:0.9rem; }
.login-box input:focus { outline:none; border-color:var(--gold); }
.login-box button { width:100%; padding:12px; background:var(--gold); color:var(--black); font-weight:700; font-size:0.88rem; letter-spacing:1.5px; margin-top:6px; }
.login-box button:hover { background:var(--gold-lt); }
.login-msg { font-size:0.8rem; color:var(--danger); margin-top:10px; text-align:center; min-height:18px; }

#app { display:none; min-height:100vh; }
#app.active { display:flex; }
.sidebar { width:240px; background:var(--dark); border-left:1px solid var(--border); padding:24px 0; display:flex; flex-direction:column; height:100vh; position:sticky; top:0; overflow-y:auto; flex-shrink:0; }
.sidebar-brand { padding:0 24px 20px; border-bottom:1px solid var(--border); margin-bottom:16px; }
.sidebar-brand h1 { font-size:0.95rem; color:var(--gold); letter-spacing:2px; font-weight:700; }
.sidebar-brand span { font-size:0.7rem; color:rgba(255,255,255,0.4); letter-spacing:1px; font-weight:300; }
.sidebar-menu { flex:1; padding:0 12px; }
.sb-item { display:flex; align-items:center; gap:12px; padding:11px 14px; color:rgba(255,255,255,0.6); font-size:0.88rem; border-radius:6px; cursor:pointer; margin-bottom:3px; font-weight:500; transition:0.2s; }
.sb-item i { width:18px; text-align:center; font-size:0.95rem; }
.sb-item:hover { background:rgba(255,255,255,0.04); color:rgba(255,255,255,0.9); }
.sb-item.active { background:rgba(184,155,94,0.12); color:var(--gold); }
.sb-item .badge { margin-right:auto; background:var(--gold); color:var(--black); font-size:0.68rem; padding:1px 7px; border-radius:10px; font-weight:700; }
.sidebar-footer { padding:12px; border-top:1px solid var(--border); }
.sb-logout { width:100%; padding:9px; background:transparent; color:rgba(255,255,255,0.5); border:1px solid var(--border); font-size:0.8rem; border-radius:6px; }
.sb-logout:hover { color:var(--danger); border-color:var(--danger); }

main { flex:1; overflow-y:auto; height:100vh; }
.topbar { padding:18px 32px; border-bottom:1px solid var(--border); background:var(--dark); display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:10; }
.topbar h2 { font-size:1.1rem; font-weight:600; color:rgba(255,255,255,0.9); }
.topbar .status { font-size:0.78rem; color:rgba(255,255,255,0.4); }
.topbar .status.saving { color:var(--warn); }
.topbar .status.saved { color:var(--success); }
.topbar .status.error { color:var(--danger); }
.content { padding:28px 32px; max-width:1200px; margin:0 auto; padding-bottom:100px; }

.card { background:var(--dark); border:1px solid var(--border); padding:22px; margin-bottom:20px; border-radius:6px; }
.card h3 { font-size:0.95rem; font-weight:600; margin-bottom:16px; color:var(--gold); padding-bottom:10px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:8px; }
.card h3 small { font-weight:300; color:rgba(255,255,255,0.4); font-size:0.75rem; margin-right:auto; }

.form-row { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:12px; }
.form-row.quad { grid-template-columns:repeat(4,1fr); }
.field { margin-bottom:14px; }
.field label { display:block; font-size:0.8rem; color:rgba(255,255,255,0.65); margin-bottom:6px; font-weight:500; }
.field label small { color:rgba(255,255,255,0.35); font-weight:400; margin-right:6px; }
.field input, .field textarea, .field select { width:100%; padding:10px 12px; background:#0f0f0f; border:1px solid var(--border); color:var(--white); font-size:0.88rem; border-radius:4px; font-family:'Cairo', sans-serif; }
.field input:focus, .field textarea:focus, .field select:focus { outline:none; border-color:var(--gold); }
.field textarea { min-height:80px; resize:vertical; line-height:1.7; }
.field.lang-ltr input, .field.lang-ltr textarea { direction:ltr; text-align:left; }

.btn { padding:10px 22px; background:var(--gold); color:var(--black); font-weight:700; font-size:0.82rem; letter-spacing:1px; border-radius:4px; transition:0.2s; }
.btn:hover { background:var(--gold-lt); }
.btn.secondary { background:transparent; color:var(--gold); border:1px solid var(--gold); }
.btn.secondary:hover { background:var(--gold); color:var(--black); }
.btn.danger { background:var(--danger); color:var(--white); }
.btn.danger:hover { background:#d32f2f; }
.btn.small { padding:7px 14px; font-size:0.75rem; }

.save-bar { position:fixed; bottom:0; right:0; left:240px; padding:14px 32px; background:var(--dark); border-top:1px solid var(--border); z-index:50; display:flex; justify-content:space-between; align-items:center; transform:translateY(100%); transition:0.3s; box-shadow:0 -10px 40px rgba(0,0,0,0.3); }
.save-bar.show { transform:translateY(0); }
.save-bar .info { font-size:0.85rem; color:var(--warn); }
.save-bar .actions { display:flex; gap:10px; }

.item-list { display:flex; flex-direction:column; gap:10px; }
.dyn-item { background:#0f0f0f; padding:16px; border:1px solid var(--border); border-radius:4px; }
.dyn-item-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; padding-bottom:8px; border-bottom:1px dashed var(--border); }
.dyn-item-head .num { color:var(--gold); font-weight:600; font-size:0.85rem; }
.dyn-item-head .actions { display:flex; gap:6px; }
.icon-btn { background:transparent; color:rgba(255,255,255,0.4); padding:4px 8px; font-size:0.85rem; border-radius:3px; }
.icon-btn:hover { background:rgba(255,255,255,0.08); color:var(--white); }
.icon-btn.del:hover { color:var(--danger); }

.add-btn { padding:10px; background:transparent; color:var(--gold); border:1px dashed var(--gold); width:100%; margin-top:12px; font-size:0.82rem; border-radius:4px; }
.add-btn:hover { background:rgba(184,155,94,0.08); }

.msg-filters { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
.msg-filters button { padding:6px 14px; background:transparent; color:rgba(255,255,255,0.6); border:1px solid var(--border); font-size:0.78rem; border-radius:4px; }
.msg-filters button.active { border-color:var(--gold); color:var(--gold); background:rgba(184,155,94,0.08); }
.msg-item { background:#0f0f0f; padding:16px 18px; margin-bottom:10px; border:1px solid var(--border); border-right:3px solid var(--gold); border-radius:4px; }
.msg-item.read { opacity:0.6; border-right-color:var(--border); }
.msg-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; flex-wrap:wrap; gap:10px; }
.msg-head .name { font-weight:700; color:var(--white); font-size:0.95rem; }
.msg-head .time { font-size:0.72rem; color:rgba(255,255,255,0.4); }
.msg-info { display:flex; flex-wrap:wrap; gap:14px; margin-bottom:8px; font-size:0.8rem; color:rgba(255,255,255,0.55); }
.msg-info span i { margin-left:5px; color:var(--gold); }
.msg-body { font-size:0.86rem; color:rgba(255,255,255,0.75); line-height:1.8; padding-top:8px; border-top:1px dashed var(--border); white-space:pre-wrap; }
.msg-actions { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
.empty { text-align:center; padding:48px 20px; color:rgba(255,255,255,0.4); font-size:0.88rem; }
.empty i { font-size:2rem; color:rgba(255,255,255,0.2); margin-bottom:12px; display:block; }

.vid-preview { width:100%; max-width:300px; aspect-ratio:16/9; background:#000; border:1px solid var(--border); margin-top:6px; border-radius:4px; }

.toast { position:fixed; bottom:90px; left:24px; z-index:9999; padding:12px 20px; background:var(--dark); color:var(--white); border:1px solid var(--border); border-left:3px solid var(--success); border-radius:4px; box-shadow:0 10px 30px rgba(0,0,0,0.4); font-size:0.85rem; opacity:0; transform:translateY(20px); transition:0.3s; pointer-events:none; }
.toast.show { opacity:1; transform:translateY(0); }
.toast.error { border-left-color:var(--danger); }

.product-card-admin { background:#0f0f0f; border:1px solid var(--border); border-radius:6px; padding:18px; display:flex; gap:16px; align-items:center; margin-bottom:12px; }
.product-card-admin img { width:80px; height:80px; object-fit:cover; border-radius:4px; flex-shrink:0; background:#222; }
.product-card-admin .pc-info { flex:1; }
.product-card-admin .pc-info h4 { color:var(--white); font-size:1rem; margin-bottom:4px; }
.product-card-admin .pc-info p { color:rgba(255,255,255,0.5); font-size:0.82rem; margin-bottom:6px; }
.product-card-admin .pc-info .meta { color:var(--gold); font-size:0.72rem; font-weight:600; letter-spacing:1px; }
.product-card-admin .pc-actions { display:flex; gap:6px; flex-direction:column; }
.pill { display:inline-block; padding:3px 10px; font-size:0.68rem; font-weight:600; letter-spacing:0.5px; border-radius:10px; background:rgba(184,155,94,0.15); color:var(--gold); margin-right:6px; }
.pill.off { background:rgba(244,67,54,0.15); color:var(--danger); }

.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:200; display:none; align-items:flex-start; justify-content:center; overflow-y:auto; padding:40px 20px; }
.modal-overlay.show { display:flex; }
.modal { background:var(--dark); border:1px solid var(--border); border-radius:8px; width:100%; max-width:900px; }
.modal-head { padding:18px 24px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; background:var(--dark); z-index:5; }
.modal-head h3 { font-size:1.05rem; color:var(--gold); }
.modal-head .close { background:transparent; color:rgba(255,255,255,0.5); font-size:1.3rem; padding:4px 12px; }
.modal-head .close:hover { color:var(--danger); }
.modal-body { padding:24px; }
.modal-foot { padding:16px 24px; border-top:1px solid var(--border); display:flex; justify-content:space-between; gap:10px; position:sticky; bottom:0; background:var(--dark); flex-wrap:wrap; }

.sec-editor { background:#0a0a0a; padding:14px; border:1px solid var(--border); border-radius:4px; margin-bottom:10px; }
.sec-editor-head { display:flex; gap:8px; margin-bottom:10px; align-items:center; }
.sec-editor-head select { width:auto; min-width:110px; }
.sec-editor-head .num { color:var(--gold); font-size:0.8rem; font-weight:600; margin-left:auto; }

.lang-tabs { display:flex; gap:4px; margin-bottom:8px; flex-wrap:wrap; }
.lang-tabs button { padding:5px 12px; background:transparent; color:rgba(255,255,255,0.5); border:1px solid var(--border); font-size:0.73rem; border-radius:4px; }
.lang-tabs button.active { color:var(--gold); border-color:var(--gold); background:rgba(184,155,94,0.08); }
.lang-pane { display:none; }
.lang-pane.active { display:block; }

.menu-toggle { display:none; background:transparent; color:var(--white); font-size:1.3rem; margin-left:10px; }
@media(max-width:900px) {
  .sidebar { position:fixed; right:-260px; top:0; height:100vh; transition:right 0.3s; z-index:100; }
  .sidebar.open { right:0; box-shadow:-10px 0 40px rgba(0,0,0,0.5); }
  main { width:100%; }
  .menu-toggle { display:inline-flex; }
  .content { padding:20px 18px; padding-bottom:100px; }
  .form-row, .form-row.quad { grid-template-columns:1fr; }
  .save-bar { left:0; }
}
</style>
</head>
<body>

<div id="loginWrap">
  <div class="login-box">
    <div class="login-logo">EMAN WARSAW<span>لوحة التحكم</span></div>
    <h2>تسجيل الدخول</h2>
    <label>اسم المستخدم</label>
    <input type="text" id="inpUser" autocomplete="username"/>
    <label>كلمة المرور</label>
    <input type="password" id="inpPass" autocomplete="current-password"/>
    <button id="btnLogin">دخول</button>
    <div class="login-msg" id="loginMsg"></div>
  </div>
</div>

<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <h1>EMAN WARSAW</h1>
      <span>لوحة التحكم</span>
    </div>
    <div class="sidebar-menu">
      <div class="sb-item active" data-page="hero"><i class="fas fa-play-circle"></i> الرئيسية والفيديوهات</div>
      <div class="sb-item" data-page="about"><i class="fas fa-info-circle"></i> من نحن</div>
      <div class="sb-item" data-page="products"><i class="fas fa-cubes"></i> المنتجات</div>

      <div class="sb-item" data-page="market"><i class="fas fa-globe"></i> السوق الأوروبي</div>

      <div class="sb-item" data-page="messages"><i class="fas fa-envelope"></i> الرسائل <span class="badge" id="msgBadge" style="display:none">0</span></div>

      <div class="sb-item" data-page="settings"><i class="fas fa-cog"></i> الإعدادات والأمان</div>
    </div>
    <div class="sidebar-footer">
      <button class="sb-logout" id="btnLogout"><i class="fas fa-sign-out-alt"></i> تسجيل الخروج</button>
    </div>

  <main>
    <div class="topbar">
      <div style="display:flex;align-items:center">
        <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
        <h2 id="pageTitle">الرئيسية والفيديوهات</h2>
      </div>
      <div class="status" id="status">جاهز</div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<div class="save-bar" id="saveBar">
  <div class="info"><i class="fas fa-exclamation-circle"></i> في تعديلات مش محفوظة على نصوص الموقع</div>
  <div class="actions">
    <button class="btn secondary" id="btnDiscard">إلغاء</button>
    <button class="btn" id="btnSave"><i class="fas fa-save"></i> حفظ</button>
  </div>
</div>

<div class="modal-overlay" id="productModal">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modalTitle">إضافة منتج</h3>
      <button class="close" onclick="closeProductModal()"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot">
      <button class="btn danger" id="btnDeleteProduct" style="display:none"><i class="fas fa-trash"></i> حذف المنتج</button>
      <div style="display:flex;gap:8px;margin-right:auto">
        <button class="btn secondary" onclick="closeProductModal()">إلغاء</button>
        <button class="btn" id="btnSaveProduct"><i class="fas fa-save"></i> حفظ المنتج</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============================================================
   SUPABASE CONFIG
============================================================ */
const SUPABASE_URL = 'https://mffpfxglevnwzyanbexr.supabase.co';
const SUPABASE_KEY = 'sb_publishable_lPa98YbCXdXpGJxitr7nNQ_EC0q_71g';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let CONTENT = {};
let ORIGINAL = '';
let PRODUCTS = [];
let CURRENT_PAGE = 'hero';
let MESSAGES = [];
let MSG_FILTER = 'all';
let CURRENT_USER = null;
let EDITING_PRODUCT = null;

const LANGS = [
  { code:'pl', name:'🇵🇱 بولندي' },
  { code:'en', name:'🇬🇧 إنجليزي' },
  { code:'de', name:'🇩🇪 ألماني' },
  { code:'ar', name:'🇪🇬 عربي' }
];

const PAGE_TITLES = {
  hero:'الرئيسية والفيديوهات', about:'من نحن', products:'المنتجات',
  logistics:'اللوجستيات', quality:'الجودة والمستندات',
  market:'السوق الأوروبي', contact:'التواصل والفورم',
  messages:'الرسائل', navbar:'القائمة والفوتر', settings:'الإعدادات والأمان'
};

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
function deepGet(o, p) { return p.split('.').reduce((x,k)=>(x && x[k]!==undefined) ? x[k] : undefined, o); }
function deepSet(o, p, v) {
  const k = p.split('.'); let t = o;
  for (let i=0; i<k.length-1; i++) { if (!t[k[i]] || typeof t[k[i]] !== 'object') t[k[i]] = {}; t = t[k[i]]; }
  t[k[k.length-1]] = v;
}
function toast(m, type='success') {
  const t = $('#toast');
  t.textContent = m;
  t.className = 'toast show' + (type==='error'?' error':'');
  setTimeout(()=>t.className = 'toast' + (type==='error'?' error':''), 2800);
}
function setStatus(s, cls='') { const e = $('#status'); e.textContent = s; e.className = 'status ' + cls; }
function isDirty() { return JSON.stringify(CONTENT) !== ORIGINAL; }
function updateSaveBar() { $('#saveBar').classList.toggle('show', isDirty()); }
function safe(v) { return String(v==null?'':v).replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

/* ============================================================ LOGIN */
async function doLogin() {
  const u = $('#inpUser').value.trim();
  const p = $('#inpPass').value;
  const msg = $('#loginMsg');
  msg.textContent = '';
  if (!u || !p) { msg.textContent = 'برجاء إدخال البيانات'; return; }
  try {
    const { data, error } = await sb.from('admin_users').select('*').eq('username', u).eq('password', p).maybeSingle();
    if (error) throw error;
    if (!data) { msg.textContent = 'بيانات الدخول غير صحيحة'; return; }
    CURRENT_USER = data;
    localStorage.setItem('ew_admin_session', JSON.stringify({ id:data.id, username:data.username, ts:Date.now() }));
    $('#loginWrap').style.display = 'none';
    $('#app').classList.add('active');
    await init();
  } catch(e) { console.error(e); msg.textContent = 'خطأ في الاتصال. اتأكد من الـ SQL.'; }
}
function doLogout() { localStorage.removeItem('ew_admin_session'); location.reload(); }
function checkSession() {
  try {
    const s = localStorage.getItem('ew_admin_session');
    if (!s) return false;
    const o = JSON.parse(s);
    if (Date.now() - o.ts > 7*24*60*60*1000) { localStorage.removeItem('ew_admin_session'); return false; }
    CURRENT_USER = o; return true;
  } catch(e) { return false; }
}

/* ============================================================ LOAD/SAVE */
async function loadContent() {
  setStatus('جاري التحميل...', 'saving');
  try {
    const { data } = await sb.from('site_content').select('content').eq('id', 1).single();
    CONTENT = (data?.content && Object.keys(data.content).length > 0) ? data.content : {};
    ORIGINAL = JSON.stringify(CONTENT);
    setStatus('جاهز', 'saved');
  } catch(e) { console.error(e); toast('خطأ في التحميل', 'error'); setStatus('خطأ', 'error'); }
}
async function loadProducts() {
  try {
    const { data } = await sb.from('products').select('*').order('sort_order', { ascending:true });
    PRODUCTS = data || [];
  } catch(e) { console.error(e); toast('خطأ في المنتجات','error'); }
}
async function loadMessages() {
  try {
    const { data } = await sb.from('contact_messages').select('*').order('created_at', { ascending:false });
    MESSAGES = data || [];
    updateMsgBadge();
  } catch(e) { console.error(e); }
}
function updateMsgBadge() {
  const u = MESSAGES.filter(m => !m.is_read).length;
  const b = $('#msgBadge');
  if (u > 0) { b.style.display = 'inline-block'; b.textContent = u; } else b.style.display = 'none';
}
async function saveContent() {
  setStatus('جاري الحفظ...', 'saving');
  try {
    const { error } = await sb.from('site_content').upsert({ id:1, content:CONTENT, updated_at:new Date().toISOString() });
    if (error) throw error;
    ORIGINAL = JSON.stringify(CONTENT);
    updateSaveBar(); setStatus('تم الحفظ', 'saved'); toast('تم الحفظ ✓');
  } catch(e) { console.error(e); toast('خطأ: '+e.message, 'error'); setStatus('فشل', 'error'); }
}
function discardChanges() {
  if (!confirm('تلغى كل التعديلات؟')) return;
  CONTENT = JSON.parse(ORIGINAL);
  renderPage(CURRENT_PAGE); updateSaveBar();
}

/* ============================================================ PAGES */
function showPage(name) {
  CURRENT_PAGE = name;
  $$('.sb-item').forEach(el => el.classList.toggle('active', el.dataset.page === name));
  $('#pageTitle').textContent = PAGE_TITLES[name] || name;
  renderPage(name);
  $('#sidebar').classList.remove('open');
}
function renderPage(name) {
  const c = $('#content');
  switch(name) {
    case 'hero':      c.innerHTML = renderHero(); break;
    case 'about':     c.innerHTML = renderAbout(); break;
    case 'products':  c.innerHTML = renderProducts(); break;
    case 'logistics': c.innerHTML = renderLogistics(); break;
    case 'quality':   c.innerHTML = renderQuality(); break;
    case 'market':    c.innerHTML = renderMarket(); break;
    case 'contact':   c.innerHTML = renderContact(); break;
    case 'messages':  c.innerHTML = renderMessages(); renderMsgList(); break;
    case 'navbar':    c.innerHTML = renderNavbar(); break;
    case 'settings':  c.innerHTML = renderSettings(); break;
  }
  bindFields();
}

function quadInput(key, isTextarea=false) {
  return LANGS.map(l => {
    const v = deepGet(CONTENT, 'translations.'+l.code+'.'+key) ?? '';
    const sv = safe(v);
    if (isTextarea) return `<div class="field"><label><small>${l.name}</small></label><textarea data-tr="${key}.${l.code}">${sv}</textarea></div>`;
    return `<div class="field"><label><small>${l.name}</small></label><input data-tr="${key}.${l.code}" value="${sv}"/></div>`;
  }).join('');
}
function trField(key, label, ta=false) {
  return `<div class="field"><label>${label}</label><div class="form-row quad">${quadInput(key, ta)}</div></div>`;
}

/* ==== PRODUCT MODAL ==== */
function newProduct() {
  EDITING_PRODUCT = {
    id: null, slug:'', category:'industrial_minerals', icon:'fas fa-cube', image:'',
    gallery: [],
    sort_order: (PRODUCTS.length ? Math.max(...PRODUCTS.map(p=>p.sort_order||0))+1 : 1),
    is_active: true,
    name: {pl:'',en:'',de:'',ar:''},
    short_desc: {pl:'',en:'',de:'',ar:''},
    long_content: {pl:{intro:'',sections:[]}, en:{intro:'',sections:[]}, de:{intro:'',sections:[]}, ar:{intro:'',sections:[]}}
  };
  openProductModal('إضافة منتج جديد');
  $('#btnDeleteProduct').style.display = 'none';
}
function editProduct(id) {
  const p = PRODUCTS.find(x => x.id === id); if (!p) return;
  EDITING_PRODUCT = JSON.parse(JSON.stringify(p));
  // اتأكد من هيكل long_content
  if (!EDITING_PRODUCT.long_content || typeof EDITING_PRODUCT.long_content !== 'object') EDITING_PRODUCT.long_content = {};
  LANGS.forEach(l => {
    if (!EDITING_PRODUCT.long_content[l.code]) EDITING_PRODUCT.long_content[l.code] = { intro:'', sections:[] };
    if (!Array.isArray(EDITING_PRODUCT.long_content[l.code].sections)) EDITING_PRODUCT.long_content[l.code].sections = [];
  });
  if (!EDITING_PRODUCT.name) EDITING_PRODUCT.name = {};
  if (!EDITING_PRODUCT.short_desc) EDITING_PRODUCT.short_desc = {};
  if (!Array.isArray(EDITING_PRODUCT.gallery)) EDITING_PRODUCT.gallery = [];
  openProductModal('تعديل المنتج');
  $('#btnDeleteProduct').style.display = 'inline-block';
}
function openProductModal(title) {
  $('#modalTitle').textContent = title;
  $('#productModal').classList.add('show');
  renderProductForm();
}
function closeProductModal() {
  $('#productModal').classList.remove('show');
  EDITING_PRODUCT = null;
}

function renderSectionList(lang) {
  const secs = EDITING_PRODUCT.long_content?.[lang]?.sections || [];
  if (!secs.length) return '<p style="color:rgba(255,255,255,0.4);text-align:center;padding:20px;font-size:0.85rem">مفيش أقسام - اضغط "إضافة قسم"</p>';
  return secs.map((s, i) => {
    let body = '';
    if (s.type === 'text') {
      body = `<textarea oninput="updateSection('${lang}',${i},'content',this.value)" placeholder="نص الفقرة..." style="min-height:80px">${safe(s.content)}</textarea>`;
    } else if (s.type === 'note') {
      body = `<textarea oninput="updateSection('${lang}',${i},'content',this.value)" placeholder="نص الملاحظة..." style="min-height:60px">${safe(s.content)}</textarea>`;
    } else if (s.type === 'list') {
      const items = (s.items||[]).map((it, j) => `<div style="display:flex;gap:6px;margin-bottom:6px">
        <input value="${safe(it)}" oninput="updateListItem('${lang}',${i},${j},this.value)" placeholder="عنصر القائمة"/>
        <button class="icon-btn del" onclick="deleteListItem('${lang}',${i},${j})"><i class="fas fa-times"></i></button>
      </div>`).join('');
      body = `${items}<button class="btn small secondary" onclick="addListItem('${lang}',${i})"><i class="fas fa-plus"></i> عنصر</button>`;
    } else if (s.type === 'uses') {
      const items = (s.items||[]).map((u, j) => `<div style="background:#050505;padding:12px;border:1px solid var(--border);border-radius:4px;margin-bottom:10px">
        <div style="display:flex;gap:10px;align-items:flex-start">
          ${u.image ? `<img src="${safe(u.image)}" style="width:70px;height:70px;object-fit:cover;border-radius:4px;flex-shrink:0" onerror="this.style.display='none'"/>` : `<div style="width:70px;height:70px;background:#1a1a1a;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--gold);opacity:0.5"><i class="fas fa-image"></i></div>`}
          <div style="flex:1;display:flex;flex-direction:column;gap:6px">
            <input placeholder="عنوان الاستخدام" value="${safe(u.title)}" oninput="updateUseItem('${lang}',${i},${j},'title',this.value)" style="font-weight:600"/>
            <input placeholder="رابط الصورة (URL)" value="${safe(u.image)}" oninput="updateUseItem('${lang}',${i},${j},'image',this.value)" style="direction:ltr;text-align:left;font-size:0.78rem"/>
            <textarea placeholder="وصف الاستخدام" oninput="updateUseItem('${lang}',${i},${j},'desc',this.value)" style="min-height:50px;font-size:0.85rem">${safe(u.desc)}</textarea>
          </div>
          <div style="display:flex;flex-direction:column;gap:4px">
            ${j>0 ? `<button class="icon-btn" onclick="moveUseItem('${lang}',${i},${j},-1)"><i class="fas fa-arrow-up"></i></button>` : ''}
            ${j<(s.items||[]).length-1 ? `<button class="icon-btn" onclick="moveUseItem('${lang}',${i},${j},1)"><i class="fas fa-arrow-down"></i></button>` : ''}
            <button class="icon-btn del" onclick="deleteUseItem('${lang}',${i},${j})"><i class="fas fa-trash"></i></button>
          </div>
        </div>
      </div>`).join('');
      body = `${items}<button class="btn small secondary" onclick="addUseItem('${lang}',${i})"><i class="fas fa-plus"></i> إضافة استخدام</button>`;
    }
    return `<div class="sec-editor">
      <div class="sec-editor-head">
        <select onchange="changeSectionType('${lang}',${i},this.value)">
          <option value="text" ${s.type==='text'?'selected':''}>نص</option>
          <option value="list" ${s.type==='list'?'selected':''}>قائمة</option>
          <option value="uses" ${s.type==='uses'?'selected':''}>استخدامات (كروت بصور)</option>
          <option value="note" ${s.type==='note'?'selected':''}>ملاحظة (إطار ذهبي)</option>
        </select>
        <input placeholder="عنوان القسم (اختياري)" value="${safe(s.heading)}" oninput="updateSection('${lang}',${i},'heading',this.value)" style="flex:1"/>
        ${i>0 ? `<button class="icon-btn" onclick="moveSection('${lang}',${i},-1)"><i class="fas fa-arrow-up"></i></button>` : ''}
        ${i<secs.length-1 ? `<button class="icon-btn" onclick="moveSection('${lang}',${i},1)"><i class="fas fa-arrow-down"></i></button>` : ''}
        <button class="icon-btn del" onclick="deleteSection('${lang}',${i})"><i class="fas fa-trash"></i></button>
        <span class="num">#${i+1}</span>
      </div>
      ${body}
    </div>`;
  }).join('');
}

function switchLangTab(lang) {
  $$('#longTabs button').forEach(b => b.classList.toggle('active', b.dataset.langTab === lang));
  $$('.lang-pane').forEach(p => p.classList.toggle('active', p.dataset.langPane === lang));
}

function addSection(lang) {
  if (!EDITING_PRODUCT.long_content[lang]) EDITING_PRODUCT.long_content[lang] = { intro:'', sections:[] };
  EDITING_PRODUCT.long_content[lang].sections.push({ type:'text', heading:'', content:'' });
  refreshSectionList(lang);
}
function deleteSection(lang, i) {
  EDITING_PRODUCT.long_content[lang].sections.splice(i, 1);
  refreshSectionList(lang);
}
function moveSection(lang, i, dir) {
  const arr = EDITING_PRODUCT.long_content[lang].sections;
  const ni = i + dir;
  if (ni<0 || ni>=arr.length) return;
  [arr[i], arr[ni]] = [arr[ni], arr[i]];
  refreshSectionList(lang);
}
function changeSectionType(lang, i, type) {
  const s = EDITING_PRODUCT.long_content[lang].sections[i];
  s.type = type;
  if (type === 'list' && !s.items) s.items = [''];
  if (type === 'uses' && !s.items) s.items = [{ title:'', desc:'', image:'' }];
  refreshSectionList(lang);
}
function updateSection(lang, i, field, val) {
  EDITING_PRODUCT.long_content[lang].sections[i][field] = val;
}
function addListItem(lang, i) {
  const s = EDITING_PRODUCT.long_content[lang].sections[i];
  if (!s.items) s.items = [];
  s.items.push('');
  refreshSectionList(lang);
}
function updateListItem(lang, i, j, val) {
  EDITING_PRODUCT.long_content[lang].sections[i].items[j] = val;
}
function deleteListItem(lang, i, j) {
  EDITING_PRODUCT.long_content[lang].sections[i].items.splice(j, 1);
  refreshSectionList(lang);
}

// دوال معرض الصور (gallery)

async function saveProduct() {
  const p = EDITING_PRODUCT;
  const slug = $('#pSlug').value.trim();
  if (!slug) { toast('Slug مطلوب', 'error'); return; }
  if (!/^[a-z0-9-]+$/.test(slug)) { toast('Slug لازم يبقى حروف إنجليزي وأرقام و - فقط', 'error'); return; }

  // اجمع القيم من الفورم
  const payload = {
    slug,
    icon: $('#pIcon').value.trim() || 'fas fa-cube',
    image: $('#pImage').value.trim() || null,
    gallery: (p.gallery || []).filter(g => g && g.trim()),
    category: $('#pCategory').value,
    sort_order: parseInt($('#pSort').value) || 0,
    is_active: $('#pActive').value === 'true',
    name: {}, short_desc: {}, long_content: p.long_content,
    updated_at: new Date().toISOString()
  };
  LANGS.forEach(l => {
    payload.name[l.code] = $('#pName_'+l.code).value.trim();
    payload.short_desc[l.code] = $('#pShort_'+l.code).value.trim();
    // حدّث الـ intro في long_content
    if (!payload.long_content[l.code]) payload.long_content[l.code] = { intro:'', sections:[] };
    payload.long_content[l.code].intro = $('#pIntro_'+l.code).value;
  });

  try {
    if (p.id) {
      const { error } = await sb.from('products').update(payload).eq('id', p.id);
      if (error) throw error;
      toast('تم تحديث المنتج ✓');
    } else {
      const { error } = await sb.from('products').insert(payload);
      if (error) throw error;
      toast('تم إضافة المنتج ✓');
    }
    closeProductModal();
    await loadProducts();
    renderPage('products');
  } catch(e) {
    console.error(e);
    toast('خطأ: ' + (e.message || 'فشل الحفظ'), 'error');
  }
}

async function deleteProduct() {
  if (!EDITING_PRODUCT?.id) return;
  if (!confirm('تحذف المنتج ده نهائيًا؟')) return;
  try {
    const { error } = await sb.from('products').delete().eq('id', EDITING_PRODUCT.id);
    if (error) throw error;
    toast('تم الحذف');
    closeProductModal();
    await loadProducts();
    renderPage('products');
  } catch(e) { toast('خطأ: '+e.message, 'error'); }
}

function setFilter(f) { MSG_FILTER = f; renderPage('messages'); }
function renderMsgList() {
  const list = $('#msgList'); if (!list) return;
  let f = MESSAGES;
  if (MSG_FILTER==='unread') f = f.filter(m=>!m.is_read);
  if (MSG_FILTER==='read') f = f.filter(m=>m.is_read);
  if (!f.length) { list.innerHTML = '<div class="empty"><i class="fas fa-envelope-open"></i>مفيش رسائل</div>'; return; }
  list.innerHTML = f.map(m => {
    const date = new Date(m.created_at).toLocaleString('ar-EG', { dateStyle:'medium', timeStyle:'short' });
    return `<div class="msg-item ${m.is_read?'read':''}">
      <div class="msg-head">
        <div class="name"><i class="fas fa-user" style="color:var(--gold);margin-left:6px"></i>${safe(m.name)}</div>
        <div class="time">${date}</div>
      </div>
      <div class="msg-info">
        ${m.company ? `<span><i class="fas fa-building"></i>${safe(m.company)}</span>` : ''}
        ${m.email ? `<span><i class="fas fa-envelope"></i>${safe(m.email)}</span>` : ''}
        ${m.phone ? `<span><i class="fas fa-phone"></i>${safe(m.phone)}</span>` : ''}
        ${m.country ? `<span><i class="fas fa-globe"></i>${safe(m.country)}</span>` : ''}
        ${m.product ? `<span><i class="fas fa-cube"></i>${safe(m.product)}</span>` : ''}
        ${m.quantity ? `<span><i class="fas fa-weight-hanging"></i>${safe(m.quantity)}</span>` : ''}
        ${m.specification ? `<span><i class="fas fa-tag"></i>${safe(m.specification)}</span>` : ''}
      </div>
      ${m.message ? `<div class="msg-body">${safe(m.message)}</div>` : ''}
      <div class="msg-actions">
        ${!m.is_read ? `<button class="btn small secondary" onclick="markRead(${m.id},true)"><i class="fas fa-check"></i> تعليم مقروء</button>` : `<button class="btn small secondary" onclick="markRead(${m.id},false)"><i class="fas fa-undo"></i> رجّع</button>`}
        ${m.email ? `<a class="btn small" href="mailto:${m.email}"><i class="fas fa-reply"></i> رد</a>` : ''}
        ${m.phone ? `<a class="btn small" style="background:#25D366;color:white" href="https://wa.me/${m.phone.replace(/\D/g,'')}" target="_blank"><i class="fab fa-whatsapp"></i> واتساب</a>` : ''}
        <button class="btn small danger" onclick="delMsg(${m.id})"><i class="fas fa-trash"></i> حذف</button>
      </div>
    </div>`;
  }).join('');
}
async function markRead(id, v) {
  try { await sb.from('contact_messages').update({ is_read:v }).eq('id', id);
    const m = MESSAGES.find(x=>x.id===id); if (m) m.is_read = v;
    renderMsgList(); updateMsgBadge(); toast(v?'تم التعليم':'تم الإرجاع');
  } catch(e) { toast('خطأ','error'); }
}
async function delMsg(id) {
  if (!confirm('تحذف الرسالة؟')) return;
  try { await sb.from('contact_messages').delete().eq('id', id);
    MESSAGES = MESSAGES.filter(m=>m.id!==id);
    renderMsgList(); updateMsgBadge(); toast('تم الحذف');
  } catch(e) { toast('خطأ','error'); }
}

async function changeCreds() {
  const u = $('#newUser').value.trim();
  const p = $('#newPass').value;
  const msg = $('#credMsg');
  if (!u && !p) { msg.style.color='var(--warn)'; msg.textContent='اكتب حاجة واحدة على الأقل'; return; }
  try {
    const upd = {};
    if (u) upd.username = u;
    if (p) upd.password = p;
    await sb.from('admin_users').update(upd).eq('id', CURRENT_USER.id);
    msg.style.color = 'var(--success)';
    msg.textContent = '✓ تم التحديث - سجل خروج ودخول بالجديد';
    if (u) CURRENT_USER.username = u;
    $('#newUser').value = ''; $('#newPass').value = '';
    toast('تم التحديث');
  } catch(e) { msg.style.color='var(--danger)'; msg.textContent='خطأ: '+e.message; }
}
async function resetAll() {
  if (!confirm('متأكد؟ هيمسح كل النصوص!')) return;
  CONTENT = {};
  try {
    await sb.from('site_content').upsert({ id:1, content:{}, updated_at:new Date().toISOString() });
    ORIGINAL = JSON.stringify(CONTENT);
    updateSaveBar(); renderPage(CURRENT_PAGE);
    toast('تم التفريغ - الموقع هيستخدم الديفولت');
  } catch(e) { toast('خطأ: '+e.message, 'error'); }
}

/* ==== Bindings ==== */
function bindFields() {
  $$('#content [data-tr]').forEach(el => {
    el.addEventListener('input', () => {
      const [key, lang] = el.dataset.tr.split('.');
      if (!CONTENT.translations) CONTENT.translations = {};
      if (!CONTENT.translations[lang]) CONTENT.translations[lang] = {};
      CONTENT.translations[lang][key] = el.value;
      updateSaveBar();
    });
  });
  $$('#content [data-path]').forEach(el => {
    el.addEventListener('input', () => { deepSet(CONTENT, el.dataset.path, el.value); updateSaveBar(); });
  });
  $$('#content [data-array]').forEach(el => {
    el.addEventListener('input', () => { deepSet(CONTENT, el.dataset.array, el.value); updateSaveBar(); });
  });
}

/* ==== Item ops (videos) ==== */
function moveItem(arrKey, idx, dir) {
  const arr = CONTENT[arrKey]; if (!arr) return;
  const ni = idx + dir; if (ni<0 || ni>=arr.length) return;
  [arr[idx], arr[ni]] = [arr[ni], arr[idx]];
  updateSaveBar(); renderPage(CURRENT_PAGE);
}
function deleteItem(arrKey, idx) {
  if (!confirm('تحذف؟')) return;
  if (!CONTENT[arrKey]) return;
  CONTENT[arrKey].splice(idx, 1);
  updateSaveBar(); renderPage(CURRENT_PAGE);
}
function addVideo() {
  if (!CONTENT.videos) CONTENT.videos = [];
  CONTENT.videos.push("");
  updateSaveBar(); renderPage('hero');
}
