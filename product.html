<!DOCTYPE html>
<html lang="pl" dir="ltr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Product | Eman Warsaw</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<link rel="stylesheet" href="style.css"/>
<link rel="icon" href="logo.png" type="image/png"/>
</head>
<body>
<div id="preloader"><img src="logo.png" alt="" class="loader-logo" onerror="this.style.display='none'"/></div>

<nav class="navbar" id="navbar"></nav>

<div id="productContent"></div>

<footer class="footer" id="footer"></footer>
<div id="fab"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared.js"></script>
<script>
function getSlug() {
  const p = new URLSearchParams(location.search);
  return p.get('slug') || '';
}

function renderProduct() {
  const slug = getSlug();
  const prods = EW.getProducts();
  const prod = prods.find(p => p.slug === slug);
  const wrap = document.getElementById('productContent');

  if (!prod) {
    wrap.innerHTML = `
      <header class="page-header"><div class="container"><h1>Product Not Found</h1><div class="line"></div></div></header>
      <section class="section"><div class="container" style="text-align:center">
        <p style="color:#666;margin-bottom:24px">---</p>
        <a href="products.html" class="hero-btn" style="color:var(--black);border-color:var(--black)">← ${EW.t('nav_products')}</a>
      </div></section>`;
    return;
  }

  // استخدامات المنتج من CONTENT.applications
  const allApps = EW.getContent().applications || [];
  const prodApps = allApps.filter(a => a.product_slug === slug);
  const appsTitle = EW.getLang()==='ar' ? 'الاستخدامات الصناعية' : EW.getLang()==='pl' ? 'Zastosowania Przemysłowe' : EW.getLang()==='de' ? 'Industrielle Anwendungen' : 'Industrial Applications';
  const appsHtml = prodApps.length ? `
    <div class="product-section reveal">
      <h2>${appsTitle}</h2>
      <div class="uses-grid">
        ${prodApps.map(u => `
          <div class="use-card">
            ${u.image ? `<img class="use-card-img" src="${u.image}" alt="" onerror="this.outerHTML='<div class=&quot;use-card-img-placeholder&quot;><i class=&quot;fas fa-image&quot;></i></div>'"/>` : `<div class="use-card-img-placeholder"><i class="fas fa-image"></i></div>`}
            <div class="use-card-body">
              <h4>${EW.loc(u.title)||''}</h4>
              <p>${EW.loc(u.desc)||''}</p>
            </div>
          </div>`).join('')}
      </div>
    </div>` : '';

  // المحتوى الطويل
  const lc = prod.long_content?.[EW.getLang()] || prod.long_content?.en || prod.long_content?.pl || {};
  const sections = lc.sections || [];

  document.title = EW.loc(prod.name) + ' | Eman Warsaw';

  const sectionsHtml = sections.map(s => {
    let body = '';
    if (s.type === 'text') {
      body = `<p>${(s.content||'').replace(/\n/g,'</p><p>')}</p>`;
    } else if (s.type === 'list') {
      const items = (s.items||[]).map(it => `<li>${it}</li>`).join('');
      body = `<ul class="product-list">${items}</ul>`;
    } else if (s.type === 'uses') {
      const items = (s.items||[]).map(u => `
        <div class="use-card">
          ${u.image ? `<img class="use-card-img" src="${u.image}" alt="" onerror="this.outerHTML='<div class=&quot;use-card-img-placeholder&quot;><i class=&quot;fas fa-image&quot;></i></div>'"/>` : `<div class="use-card-img-placeholder"><i class="fas fa-image"></i></div>`}
          <div class="use-card-body">
            <h4>${u.title||''}</h4>
            <p>${u.desc||''}</p>
          </div>
        </div>`).join('');
      body = `<div class="uses-grid">${items}</div>`;
    } else if (s.type === 'note') {
      return `<div class="product-note">${s.content||''}</div>`;
    }
    return `
      <div class="product-section reveal">
        ${s.heading ? `<h2>${s.heading}</h2>` : ''}
        ${body}
      </div>`;
  }).join('');

  // أقسام إضافية لمنتج الرخام
  const marbleExtraHtml = (prod.slug === 'marble' || prod.slug === 'natural-marble' || (prod.category && prod.category.toLowerCase().includes('marble')) || (EW.loc(prod.name) && EW.loc(prod.name).toLowerCase().includes('marbre')) || (prod.slug && prod.slug.toLowerCase().includes('marble'))) ? renderMarbleExtra() : '';

  // معرض الصور
  const gallery = (prod.gallery && Array.isArray(prod.gallery)) ? prod.gallery.filter(g => g) : [];
  const galleryHtml = gallery.length ? `
    <div class="product-section reveal">
      <h2>${EW.getLang()==='ar'?'معرض الصور':EW.getLang()==='pl'?'Galeria':EW.getLang()==='de'?'Galerie':'Gallery'}</h2>
      <div class="product-gallery">
        ${gallery.map(src => `<img src="${src}" alt="" onerror="this.style.display='none'" onclick="openLightbox('${src}')"/>`).join('')}
      </div>
    </div>` : '';

  wrap.innerHTML = `
    <section class="product-hero">
      <div class="container">
        <div class="product-hero-inner">
          <div class="product-hero-text">
            <div class="icon"><i class="${prod.icon||'fas fa-cube'}"></i></div>
            <h1>${EW.loc(prod.name)}</h1>
            <p>${EW.loc(prod.short_desc)}</p>
          </div>
          <div class="product-hero-img">
            ${prod.image ? `<img src="${prod.image}" alt="" onerror="this.style.display='none'"/>` : ''}
          </div>
        </div>
      </div>
    </section>
    <section class="product-body">
      <div class="container" style="max-width:900px">
        ${lc.intro ? `<div class="product-section reveal"><p style="font-size:1rem;line-height:2;color:#333">${lc.intro.replace(/\n/g,'</p><p style="font-size:1rem;line-height:2;color:#333;margin-top:14px">')}</p></div>` : ''}
        ${appsHtml}
        ${marbleExtraHtml}
        ${galleryHtml}
        ${sectionsHtml}
        <div style="text-align:center; margin-top:60px">
          <a href="contact.html" class="pc-cta" style="padding:14px 40px; font-size:0.82rem">${EW.t('nav_contact')}</a>
        </div>
      </div>
    </section>
    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
      <div class="lb-close"><i class="fas fa-times"></i></div>
      <img id="lightboxImg" src="" alt=""/>
    </div>`;

  document.querySelectorAll('.product-section.reveal').forEach(el => {
    new IntersectionObserver((entries, o) => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); o.unobserve(e.target); }});
    }, { threshold:0.1 }).observe(el);
  });
}

function renderMarbleExtra() {
  const lang = EW.getLang();
  const sections = {
    ar: {
      q_title: 'ما الذي نراعيه؟',
      q_intro: 'نعمل على مراعاة عدد من العناصر الأساسية عند توريد الرخام، مثل:',
      q_items: ['النوع واللون','التجهيز المطلوب','المقاسات','التشطيب','التعبئة','أسلوب الشحن','احتياجات المشروع أو السوق'],
      f_title: 'التشطيبات',
      f_intro: 'بحسب نوع المنتج والاتفاق، يمكن مناقشة صور تشطيب مختلفة مثل:',
      f_items: ['مصقول','نصف مصقول','مشطوف أو تجهيزات خاصة','مقاسات حسب الطلب'],
      p_title: 'التعبئة والشحن',
      p_text: 'نولي اهتمامًا كبيرًا بطريقة تعبئة الرخام وحمايته أثناء النقل، بما يتناسب مع طبيعة المنتج سواء كان ألواحًا أو بلاطات أو كتلًا خامًا، وبما يضمن تقليل مخاطر النقل وتحسين كفاءة التوريد.',
      closing: 'نحن لا نكتفي بتوفير الرخام كمنتج، بل نعمل على تقديمه ضمن إطار تجاري منظم يراعي المواصفة، وطبيعة الاستخدام، وطريقة التجهيز، ومتطلبات السوق الأوروبي.',
    },
    en: {
      q_title: 'What Do We Consider?',
      q_intro: 'We pay attention to a number of key elements when supplying marble, such as:',
      q_items: ['Type and Color','Required Preparation','Dimensions','Finish','Packaging','Shipping Method','Project or Market Needs'],
      f_title: 'Finishes',
      f_intro: 'Depending on the product type and agreement, different finish types can be discussed, such as:',
      f_items: ['Polished','Semi-polished','Chamfered or special finishes','Custom dimensions on request'],
      p_title: 'Packaging & Shipping',
      p_text: 'We pay great attention to the method of packaging and protecting marble during transport, in line with the nature of the product — whether slabs, tiles, or raw blocks — ensuring reduced transport risks and improved supply efficiency.',
      closing: 'We do not simply supply marble as a product; we present it within an organized commercial framework that considers the specification, nature of use, preparation method, and requirements of the European market.',
    },
    pl: {
      q_title: 'Na co zwracamy uwagę?',
      q_intro: 'Przy dostawie marmuru uwzględniamy szereg kluczowych elementów, takich jak:',
      q_items: ['Typ i kolor','Wymagane przygotowanie','Wymiary','Wykończenie','Pakowanie','Metoda wysyłki','Potrzeby projektu lub rynku'],
      f_title: 'Wykończenia',
      f_intro: 'W zależności od rodzaju produktu i umowy można omówić różne rodzaje wykończeń, takie jak:',
      f_items: ['Polerowane','Półpolerowane','Fasetowane lub specjalne wykończenia','Wymiary na zamówienie'],
      p_title: 'Pakowanie i wysyłka',
      p_text: 'Przywiązujemy dużą wagę do metody pakowania i ochrony marmuru podczas transportu, stosownie do charakteru produktu — czy to płyty, płytki czy surowe bloki — zapewniając zmniejszenie ryzyka transportowego i poprawę efektywności dostaw.',
      closing: 'Nie tylko dostarczamy marmur jako produkt — prezentujemy go w zorganizowanych ramach handlowych, uwzględniając specyfikację, charakter zastosowania, metodę przygotowania i wymagania rynku europejskiego.',
    },
    de: {
      q_title: 'Worauf achten wir?',
      q_intro: 'Bei der Lieferung von Marmor berücksichtigen wir eine Reihe wesentlicher Elemente, wie zum Beispiel:',
      q_items: ['Typ und Farbe','Erforderliche Vorbereitung','Abmessungen','Oberfläche','Verpackung','Versandmethode','Projekt- oder Marktanforderungen'],
      f_title: 'Oberflächen',
      f_intro: 'Je nach Produktart und Vereinbarung können verschiedene Oberflächenarten besprochen werden, wie zum Beispiel:',
      f_items: ['Poliert','Halbpoliert','Gefast oder Sonderbearbeitung','Abmessungen auf Anfrage'],
      p_title: 'Verpackung & Versand',
      p_text: 'Wir legen großen Wert auf die Verpackungs- und Schutzmethode von Marmor beim Transport, entsprechend der Produktart — ob Platten, Fliesen oder Rohblöcke — um Transportrisiken zu minimieren und die Liefereffizienz zu verbessern.',
      closing: 'Wir liefern Marmor nicht nur als Produkt — wir präsentieren ihn in einem organisierten kommerziellen Rahmen, der Spezifikation, Verwendungszweck, Vorbereitungsmethode und Anforderungen des europäischen Marktes berücksichtigt.',
    }
  };
  const s = sections[lang] || sections.en;
  return \`
    <div class="product-section reveal">
      <h2>\${s.q_title}</h2>
      <p style="color:#444;line-height:2;margin-bottom:16px">\${s.q_intro}</p>
      <ul class="product-list">\${s.q_items.map(i=>\`<li>\${i}</li>\`).join('')}</ul>
    </div>
    <div class="product-section reveal">
      <h2>\${s.f_title}</h2>
      <p style="color:#444;line-height:2;margin-bottom:16px">\${s.f_intro}</p>
      <ul class="product-list">\${s.f_items.map(i=>\`<li>\${i}</li>\`).join('')}</ul>
    </div>
    <div class="product-section reveal">
      <h2>\${s.p_title}</h2>
      <p style="color:#444;line-height:2">\${s.p_text}</p>
    </div>
    <div class="product-note">\${s.closing}</div>\`;
}

window.onReady = renderProduct;
window.onLangChange = renderProduct;

window.openLightbox = function(src) {
  const lb = document.getElementById('lightbox');
  const img = document.getElementById('lightboxImg');
  if (lb && img) { img.src = src; lb.classList.add('show'); }
};
window.closeLightbox = function() {
  const lb = document.getElementById('lightbox');
  if (lb) lb.classList.remove('show');
};

EW.sharedInit('products');
</script>
</body>
</html>
