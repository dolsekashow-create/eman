<!DOCTYPE html>
<html lang="pl" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eman Warsaw For Trading | CaCO₃</title>
  <meta name="description" content="Eman Warsaw For Trading sp. z o.o. — Professional calcium carbonate supply solutions between Egypt and Europe." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="icon" href="logo.png" type="image/png" />

<style>
/* ===== EMAN WARSAW — STYLE ===== */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --gold: #B89B5E;
  --gold-lt: #D4BC82;
  --gold-dk: #8C7340;
  --black: #0E0E0E;
  --dark: #171717;
  --white: #FFF;
  --off: #F8F7F3;
  --gray: #777;
  --border: rgba(0,0,0,0.06);
  --font-main: 'Montserrat', sans-serif;
  --font-ar: 'Cairo', sans-serif;
  --ease: 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
}

html { scroll-behavior: smooth; }

body {
  font-family: var(--font-main);
  font-weight: 300; color: var(--black);
  background: var(--white);
  overflow-x: hidden; line-height: 1.8; font-size: 15px;
}
body.rtl { direction: rtl; font-family: var(--font-ar); }

a { text-decoration: none; color: inherit; }
ul { list-style: none; }
img { max-width: 100%; display: block; }
.container { max-width: 1100px; margin: 0 auto; padding: 0 24px; }

/* === Preloader === */
#preloader {
  position: fixed; inset: 0; background: var(--black);
  display: flex; align-items: center; justify-content: center;
  z-index: 99999; transition: opacity 0.5s;
}
#preloader.hidden { opacity: 0; pointer-events: none; }
.loader-logo { width: 80px; animation: fadePulse 1.8s ease-in-out infinite; }
@keyframes fadePulse { 0%,100%{opacity:.25;transform:scale(.95)} 50%{opacity:1;transform:scale(1)} }

/* === Navbar === */
.navbar {
  position: fixed; top: 0; left: 0; width: 100%;
  z-index: 1000; padding: 14px 0; transition: var(--ease);
}
.navbar.scrolled {
  background: rgba(14,14,14,0.96); backdrop-filter: blur(16px);
  padding: 8px 0; box-shadow: 0 1px 30px rgba(0,0,0,0.3);
}
.navbar .container { display: flex; align-items: center; justify-content: space-between; }

.nav-brand { display: flex; align-items: center; gap: 12px; }
.nav-brand img { height: 44px; width: auto; }
.nav-brand-text {
  font-size: 0.82rem; font-weight: 500; color: var(--gold);
  letter-spacing: 2.5px; text-transform: uppercase; line-height: 1.2;
}
.nav-brand-text span { display: block; color: rgba(255,255,255,0.5); font-weight: 300; font-size: 0.62rem; letter-spacing: 1.5px; }

.nav-links { display: flex; align-items: center; gap: 26px; }
.nav-links a {
  color: rgba(255,255,255,0.7); font-size: 0.7rem; font-weight: 400;
  letter-spacing: 1.5px; text-transform: uppercase; transition: color 0.3s; cursor: pointer;
}
.nav-links a:hover, .nav-links a.active { color: var(--gold); }

/* Language Dropdown */
.lang-dropdown { position: relative; }
.lang-btn {
  background: transparent; border: 1px solid var(--gold);
  color: var(--gold); padding: 5px 14px; border-radius: 2px;
  cursor: pointer; font-size: 0.7rem; font-weight: 500;
  letter-spacing: 1px; transition: var(--ease);
  font-family: var(--font-main); display: flex; align-items: center; gap: 6px;
}
.lang-btn:hover { background: var(--gold); color: var(--black); }
.lang-btn i { font-size: 0.6rem; transition: transform 0.3s; }
.lang-dropdown.open .lang-btn i { transform: rotate(180deg); }

.lang-menu {
  position: absolute; top: calc(100% + 8px); right: 0;
  background: var(--dark); border: 1px solid rgba(255,255,255,0.08);
  min-width: 150px; opacity: 0; pointer-events: none;
  transform: translateY(-8px); transition: var(--ease);
  box-shadow: 0 8px 30px rgba(0,0,0,0.4);
}
body.rtl .lang-menu { right: auto; left: 0; }
.lang-dropdown.open .lang-menu { opacity: 1; pointer-events: auto; transform: translateY(0); }

.lang-menu button {
  display: flex; align-items: center; gap: 10px;
  width: 100%; padding: 10px 16px; background: none; border: none;
  color: rgba(255,255,255,0.7); font-size: 0.78rem; font-weight: 300;
  cursor: pointer; transition: background 0.2s, color 0.2s;
  font-family: var(--font-main); text-align: left;
}
body.rtl .lang-menu button { text-align: right; }
.lang-menu button:hover { background: rgba(184,155,94,0.1); color: var(--gold); }
.lang-menu button.active { color: var(--gold); font-weight: 500; }

.hamburger {
  display: none; flex-direction: column; gap: 5px;
  cursor: pointer; z-index: 1001;
}
.hamburger span { width: 24px; height: 1.5px; background: var(--white); transition: var(--ease); }
.hamburger.active span:nth-child(1) { transform: rotate(45deg) translate(5px,5px); }
.hamburger.active span:nth-child(2) { opacity: 0; }
.hamburger.active span:nth-child(3) { transform: rotate(-45deg) translate(5px,-5px); }

/* === Hero === */
.hero {
  position: relative; height: 100vh; min-height: 600px;
  overflow: hidden; display: flex; align-items: center; justify-content: center;
}
.hero-videos { position: absolute; inset: 0; z-index: 0; }
.hero-videos video {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; opacity: 0; transition: opacity 1.4s ease;
}
.hero-videos video.active { opacity: 1; }
.hero-overlay {
  position: absolute; inset: 0; z-index: 1;
  background: linear-gradient(180deg,rgba(0,0,0,0.65),rgba(0,0,0,0.3) 50%,rgba(0,0,0,0.7));
}

/* Egyptian decorative border */
.hero::after {
  content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 4px;
  z-index: 3;
  background: repeating-linear-gradient(90deg, var(--gold) 0px, var(--gold) 20px, transparent 20px, transparent 28px);
}

.hero-content {
  position: relative; z-index: 2; text-align: center;
  color: var(--white); max-width: 800px; padding: 0 24px;
}
.hero-logo { width: 100px; margin: 0 auto 28px; filter: drop-shadow(0 4px 20px rgba(184,155,94,0.3)); }
.hero-content h1 {
  font-size: clamp(1.6rem,3.8vw,2.8rem);
  font-weight: 300; letter-spacing: 5px; text-transform: uppercase;
  margin-bottom: 20px; line-height: 1.3;
}
.hero-content h1 .gold { color: var(--gold); font-weight: 500; }
.hero-sub {
  font-size: clamp(0.82rem,1.3vw,0.95rem);
  font-weight: 300; line-height: 1.95; opacity: 0.75;
  margin-bottom: 36px; max-width: 660px; margin-left: auto; margin-right: auto;
}
.hero-btn {
  display: inline-block; padding: 13px 40px;
  border: 1px solid var(--gold); color: var(--gold);
  font-size: 0.76rem; font-weight: 500; letter-spacing: 2.5px;
  text-transform: uppercase; transition: var(--ease);
  font-family: var(--font-main); cursor: pointer;
}
.hero-btn:hover { background: var(--gold); color: var(--black); }

.hero-dots {
  position: absolute; bottom: 32px; left: 50%;
  transform: translateX(-50%); z-index: 3;
  display: flex; gap: 10px;
}
.hero-dots span {
  width: 36px; height: 2px; background: rgba(255,255,255,0.2);
  cursor: pointer; transition: var(--ease);
}
.hero-dots span.active { background: var(--gold); width: 56px; }

.egypt-divider {
  text-align: center; color: var(--gold);
  padding: 10px 0; background: var(--black);
  letter-spacing: 12px; font-size: 0.65rem;
}

/* === Sections === */
.section { padding: 100px 0; }
.section.bg-off { background: var(--off); }
.section.bg-dark { background: var(--black); color: rgba(255,255,255,0.75); }
.section.bg-dark h2, .section.bg-dark h3, .section.bg-dark h4 { color: var(--white); }

.sec-head { text-align: center; margin-bottom: 56px; }
.sec-head h2 {
  font-size: clamp(1.3rem,3vw,2.1rem);
  font-weight: 300; letter-spacing: 4px; text-transform: uppercase;
  margin-bottom: 14px;
}
.sec-head .line { width: 40px; height: 1.5px; background: var(--gold); margin: 0 auto 16px; }
.sec-head p { font-size: 0.88rem; color: var(--gray); max-width: 600px; margin: 0 auto; font-weight: 300; }
.section.bg-dark .sec-head p { color: rgba(255,255,255,0.6); }

/* === About === */
.about-wrap { display: grid; grid-template-columns: 1.3fr 1fr; gap: 48px; align-items: center; }
.about-text h3 { font-size: 1.15rem; font-weight: 400; margin-bottom: 16px; color: var(--gold); }
.about-text p { font-size: 0.92rem; color: #444; line-height: 1.9; margin-bottom: 14px; }
.about-img { position: relative; }
.about-img img { width: 100%; height: 420px; object-fit: cover; }
.about-img::after {
  content: ''; position: absolute;
  top: 14px; left: 14px; right: -14px; bottom: -14px;
  border: 1px solid var(--gold); z-index: -1;
}
body.rtl .about-img::after { left: -14px; right: 14px; }

/* === Product === */
.prod-intro { max-width: 800px; margin: 0 auto 48px; text-align: center; }
.prod-intro p { font-size: 0.9rem; color: #555; line-height: 1.9; margin-bottom: 12px; }

.specs-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 20px; margin-top: 40px; }
.spec-item { text-align: center; padding: 30px 18px; border: 1px solid var(--border); transition: var(--ease); background: var(--white); }
.spec-item:hover { border-color: var(--gold); }
.spec-icon { font-size: 1.5rem; color: var(--gold); margin-bottom: 12px; }
.spec-item h4 { font-size: 0.78rem; font-weight: 500; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 6px; }
.spec-item p { font-size: 0.8rem; color: var(--gray); font-weight: 300; }

.prod-note {
  margin-top: 40px; padding: 18px 24px;
  border-left: 3px solid var(--gold); background: rgba(184,155,94,0.04);
  font-size: 0.86rem; color: #555; font-style: italic;
}
body.rtl .prod-note { border-left: none; border-right: 3px solid var(--gold); }

/* === Applications === */
.apps-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 20px; }
.app-card { padding: 24px 22px; border: 1px solid rgba(255,255,255,0.07); transition: var(--ease); }
.app-card:hover { border-color: var(--gold); background: rgba(184,155,94,0.03); }
.app-card h4 { font-size: 0.85rem; font-weight: 500; margin-bottom: 8px; color: var(--gold); }
.app-card p { font-size: 0.82rem; color: rgba(255,255,255,0.5); font-weight: 300; line-height: 1.75; }
.apps-footer {
  margin-top: 44px; text-align: center; max-width: 720px; margin-left: auto; margin-right: auto;
  font-size: 0.86rem; color: rgba(255,255,255,0.45); font-style: italic;
}

/* === Why Us === */
.why-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 24px; }
.why-card { padding: 32px 22px; border: 1px solid var(--border); transition: var(--ease); background: var(--white); }
.why-card:hover { border-color: var(--gold); }
.why-card .why-icon { font-size: 1.4rem; color: var(--gold); margin-bottom: 14px; }
.why-card h4 { font-size: 0.84rem; font-weight: 500; margin-bottom: 10px; }
.why-card p { font-size: 0.82rem; color: var(--gray); font-weight: 300; line-height: 1.75; }

/* === Logistics === */
.logi-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; }
.logi-text p { font-size: 0.9rem; color: #555; line-height: 1.9; margin-bottom: 14px; }
.logi-text h3 { font-size: 1.1rem; font-weight: 500; margin-bottom: 14px; }
.logi-list { margin-top: 6px; }
.logi-list li { position: relative; padding-left: 18px; font-size: 0.86rem; color: #555; margin-bottom: 9px; font-weight: 300; }
body.rtl .logi-list li { padding-left: 0; padding-right: 18px; }
.logi-list li::before { content: ''; position: absolute; left: 0; top: 10px; width: 5px; height: 5px; background: var(--gold); border-radius: 50%; }
body.rtl .logi-list li::before { left: auto; right: 0; }
.logi-box { padding: 24px; border: 1px solid var(--border); margin-bottom: 20px; background: var(--white); }
.logi-box h4 { font-size: 0.78rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 10px; color: var(--gold); }

/* === Quality === */
.qual-content { max-width: 800px; margin: 0 auto; }
.qual-content > p { font-size: 0.9rem; color: #555; line-height: 1.9; margin-bottom: 14px; }
.qual-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; margin-top: 32px; }
.qual-box { padding: 24px; border: 1px solid var(--border); background: var(--white); }
.qual-box h4 { font-size: 0.78rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 12px; color: var(--gold); }
.qual-box li { position: relative; padding-left: 16px; font-size: 0.84rem; color: #555; margin-bottom: 7px; font-weight: 300; }
body.rtl .qual-box li { padding-left: 0; padding-right: 16px; }
.qual-box li::before { content: ''; position: absolute; left: 0; top: 10px; width: 4px; height: 4px; background: var(--gold); border-radius: 50%; }
body.rtl .qual-box li::before { left: auto; right: 0; }
.qual-note {
  margin-top: 32px; padding: 18px 24px;
  border-left: 3px solid var(--gold); background: rgba(184,155,94,0.04);
  font-size: 0.84rem; color: #555;
}
body.rtl .qual-note { border-left: none; border-right: 3px solid var(--gold); }

/* === Market === */
.market-content { max-width: 720px; margin: 0 auto; text-align: center; }
.market-content p { font-size: 0.92rem; color: rgba(255,255,255,0.55); line-height: 1.9; margin-bottom: 14px; font-weight: 300; }

/* === Contact === */
.contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; }
.contact-text h3 { font-size: 1.15rem; font-weight: 400; margin-bottom: 18px; }
.contact-text > p { font-size: 0.9rem; color: #555; line-height: 1.9; margin-bottom: 24px; }
.c-item { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 20px; }
.c-icon { font-size: 1.05rem; color: var(--gold); margin-top: 3px; }
.c-item h5 { font-size: 0.84rem; font-weight: 500; margin-bottom: 2px; }
.c-item p { font-size: 0.84rem; color: var(--gray); font-weight: 300; }

/* Contact Form */
.contact-form { background: var(--white); padding: 28px; border: 1px solid var(--border); }
.contact-form h4 { font-size: 0.95rem; font-weight: 500; margin-bottom: 16px; color: var(--gold); }
.cf-group { margin-bottom: 14px; }
.cf-group input, .cf-group textarea {
  width: 100%; padding: 11px 14px; border: 1px solid var(--border);
  font-family: var(--font-main); font-size: 0.85rem; font-weight: 300;
  background: var(--off); transition: var(--ease); color: var(--black);
}
body.rtl .cf-group input, body.rtl .cf-group textarea { font-family: var(--font-ar); }
.cf-group input:focus, .cf-group textarea:focus { outline: none; border-color: var(--gold); background: var(--white); }
.cf-group textarea { min-height: 100px; resize: vertical; }
.cf-submit {
  padding: 12px 32px; background: var(--gold); color: var(--white);
  border: none; font-family: var(--font-main); font-size: 0.76rem; font-weight: 500;
  letter-spacing: 2px; text-transform: uppercase; cursor: pointer;
  transition: var(--ease);
}
.cf-submit:hover { background: var(--gold-dk); }
.cf-submit:disabled { opacity: 0.6; cursor: not-allowed; }
.cf-msg { margin-top: 12px; font-size: 0.82rem; padding: 10px; display: none; }
.cf-msg.success { background: rgba(67,160,71,0.1); color: #2e7d32; display: block; }
.cf-msg.error { background: rgba(229,57,53,0.1); color: #c62828; display: block; }

/* === Footer === */
.footer { background: #0A0A0A; color: var(--gray); padding: 40px 0 18px; }
.footer-inner { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px; }
.footer-brand { display: flex; align-items: center; gap: 10px; }
.footer-brand img { height: 32px; }
.footer-brand span { font-size: 0.85rem; color: var(--gold); letter-spacing: 2px; font-weight: 500; }
.footer-copy { font-size: 0.75rem; font-weight: 300; }

/* Zero-Nine credit video */
.footer-bottom { padding: 28px 0 6px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
.footer-dev-frame { display: block; position: relative; overflow: hidden; border-radius: 16px; border: 2px solid rgba(184,155,94,0.35); text-decoration: none; transition: all 0.3s; max-width: 420px; width: 90%; }
.footer-dev-frame::before { content: ''; position: absolute; inset: 4px; border: 1px solid rgba(184,155,94,0.15); border-radius: 12px; pointer-events: none; z-index: 3; }
.footer-dev-frame:hover { border-color: rgba(184,155,94,0.55); transform: translateY(-2px); box-shadow: 0 8px 30px rgba(184,155,94,0.15); }
.footer-dev-video { width: 100%; display: block; border-radius: 14px; }

.footer::before {
  content: ''; display: block; width: 100%; height: 3px; margin-bottom: 36px;
  background: repeating-linear-gradient(90deg, var(--gold) 0px, var(--gold) 16px, transparent 16px, transparent 24px);
  opacity: 0.3;
}

/* === FAB === */
.fab-wrap { position: fixed; bottom: 28px; right: 28px; z-index: 999; }
body.rtl .fab-wrap { right: auto; left: 28px; }
.fab-btn {
  width: 52px; height: 52px; border-radius: 50%;
  background: var(--gold); color: var(--black); border: none;
  font-size: 1.3rem; cursor: pointer;
  box-shadow: 0 4px 20px rgba(184,155,94,0.35);
  transition: var(--ease);
  display: flex; align-items: center; justify-content: center;
  position: relative; z-index: 2;
}
.fab-btn:hover { box-shadow: 0 6px 28px rgba(184,155,94,0.5); transform: scale(1.06); }
.fab-btn.active { transform: rotate(45deg); }
.fab-menu {
  position: absolute; bottom: 66px; right: 2px;
  display: flex; flex-direction: column; gap: 11px; align-items: center;
  opacity: 0; pointer-events: none; transition: var(--ease);
}
body.rtl .fab-menu { right: auto; left: 2px; }
.fab-menu.open { opacity: 1; pointer-events: auto; }
.fab-link {
  width: 42px; height: 42px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: var(--white); font-size: 1rem;
  box-shadow: 0 3px 12px rgba(0,0,0,0.2);
  transition: var(--ease); transform: scale(0) translateY(14px);
  position: relative;
}
.fab-menu.open .fab-link { transform: scale(1) translateY(0); }
.fab-menu.open .fab-link:nth-child(1){transition-delay:.03s}
.fab-menu.open .fab-link:nth-child(2){transition-delay:.06s}
.fab-menu.open .fab-link:nth-child(3){transition-delay:.09s}
.fab-menu.open .fab-link:nth-child(4){transition-delay:.12s}
.fab-link:hover { transform: scale(1.12) !important; }
.fab-wa{background:#25D366} .fab-ph{background:#43A047} .fab-fb{background:#1877F2} .fab-em{background:#E53935}

.fab-tip {
  position: absolute; right: 54px;
  background: var(--black); color: var(--white);
  padding: 3px 10px; border-radius: 3px;
  font-size: 0.65rem; white-space: nowrap;
  opacity: 0; pointer-events: none; transition: opacity 0.3s;
}
body.rtl .fab-tip { right: auto; left: 54px; }
.fab-link:hover .fab-tip { opacity: 1; }

/* === Reveal === */
.reveal { opacity: 0; transform: translateY(28px); transition: opacity 0.6s ease, transform 0.6s ease; }
.reveal.visible { opacity: 1; transform: translateY(0); }

/* === Responsive === */
@media(max-width:1024px){
  .why-grid{grid-template-columns:repeat(2,1fr)}
  .apps-grid{grid-template-columns:1fr}
}
@media(max-width:768px){
  .hamburger{display:flex}
  .nav-links{
    position:fixed;top:0;right:-100%;width:260px;height:100vh;
    background:var(--black);flex-direction:column;justify-content:center;gap:22px;
    transition:right .4s ease;box-shadow:-4px 0 30px rgba(0,0,0,.4);
  }
  body.rtl .nav-links{right:auto;left:-100%}
  .nav-links.open{right:0}
  body.rtl .nav-links.open{right:auto;left:0}
  .nav-links a{font-size:.88rem}
  .lang-menu{right:auto;left:0}
  .about-wrap,.contact-grid,.logi-cols,.qual-grid{grid-template-columns:1fr}
  .about-img img{height:260px}
  .about-img::after{display:none}
  .specs-grid,.why-grid{grid-template-columns:1fr;max-width:400px;margin-left:auto;margin-right:auto}
  .footer-inner{flex-direction:column;text-align:center}
}
</style>
</head>
<body>

<!-- PRELOADER -->
<div id="preloader"><img src="logo.png" alt="Eman" class="loader-logo" onerror="this.style.display='none'" /></div>

<!-- NAVBAR -->
<nav class="navbar" id="navbar">
  <div class="container">
    <a href="#hero" class="nav-brand">
      <img src="logo.png" alt="Eman Warsaw Logo" onerror="this.style.display='none'" />
      <div class="nav-brand-text" id="brandText">EMAN WARSAW<span id="brandSubText">For Trading sp. z o.o.</span></div>
    </a>
    <ul class="nav-links" id="navLinks">
      <li><a href="#about" data-key="nav_about">O nas</a></li>
      <li><a href="#product" data-key="nav_product">Produkt</a></li>
      <li><a href="#applications" data-key="nav_applications">Zastosowania</a></li>

let CONTENT = {};
let currentLang = 'pl';

const rtlLangs = ['ar'];

// تحميل المحتوى من Supabase أو fallback على الديفولت
async function loadContent() {
  try {
    const { data, error } = await sb.from('site_content').select('content').eq('id', 1).single();
    if (error) throw error;
    if (data && data.content && Object.keys(data.content).length > 0) {
      CONTENT = { ...DEFAULT_CONTENT, ...data.content };
    } else {
      CONTENT = DEFAULT_CONTENT;
      // احفظ الديفولت أول مرة
      await sb.from('site_content').upsert({ id: 1, content: DEFAULT_CONTENT });
    }
  } catch (e) {
    console.warn('Supabase load failed, using default:', e);
    CONTENT = DEFAULT_CONTENT;
  }
  render();
}

// رسم كل المحتوى
function render() {
  renderVideos();
  renderStaticTexts();
  renderSpecs();
  renderApplications();
  renderWhyCards();
  renderLogiLists();
  renderQualLists();
  renderContact();
  applyLanguage(currentLang);
}

function renderVideos() {
  const wrap = document.getElementById('heroVideos');
  const dots = document.getElementById('heroDots');
  wrap.innerHTML = '';
  dots.innerHTML = '';
  const vids = CONTENT.videos || [];
  vids.forEach((src, i) => {
    const v = document.createElement('video');
    v.src = src;
    v.muted = true; v.loop = true; v.playsInline = true;
    if (i === 0) v.classList.add('active');
    wrap.appendChild(v);
    const d = document.createElement('span');
    d.dataset.i = i;
    if (i === 0) d.classList.add('active');
    dots.appendChild(d);
  });
  initVideoRotation();
}

function applyLanguage(lang) {
  currentLang = lang;
  const isRtl = rtlLangs.includes(lang);
  document.documentElement.lang = lang;
  document.documentElement.dir = isRtl ? 'rtl' : 'ltr';
  document.body.classList.toggle('rtl', isRtl);
  document.getElementById('langBtnLabel').textContent = langNames[lang];
  document.querySelectorAll('.lang-menu button').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));

  // ترجمات أساسية من translations
  const t = (CONTENT.translations || DEFAULT_CONTENT.translations)[lang] || {};
  document.querySelectorAll('[data-key]').forEach(el => {
    const k = el.dataset.key;
    if (t[k] !== undefined) el.innerHTML = t[k];
  });
  document.querySelectorAll('[data-key-ph]').forEach(el => {
    const k = el.dataset.keyPh;
    if (t[k] !== undefined) el.placeholder = t[k];
  });

  // عناصر لها JSON trans (specs, apps, why, lists)
  document.querySelectorAll('[data-i18n]').forEach(el => {
    try {
      const o = JSON.parse(el.getAttribute('data-i18n'));
      if (o[lang]) el.textContent = o[lang];
    } catch(e){}
  });

  // اعد تشغيل reveal للعناصر الجديدة
  document.querySelectorAll('.reveal').forEach(el => {
    if (!el.classList.contains('visible')) obs.observe(el);
  });
}

// ============ UI إعدادات ============
const pre = document.getElementById('preloader');
window.addEventListener('load', () => setTimeout(() => pre.classList.add('hidden'), 600));
setTimeout(() => pre.classList.add('hidden'), 3000);

const nav = document.getElementById('navbar');
window.addEventListener('scroll', () => nav.classList.toggle('scrolled', scrollY > 50));

const ham = document.getElementById('hamburger');
const links = document.getElementById('navLinks');
ham.addEventListener('click', () => { ham.classList.toggle('active'); links.classList.toggle('open'); });
links.querySelectorAll('a').forEach(a => a.addEventListener('click', () => { ham.classList.remove('active'); links.classList.remove('open'); }));

// Hero video rotation
let cur = 0, timer;
function initVideoRotation() {
  const vids = document.querySelectorAll('.hero-videos video');
  const dots = document.querySelectorAll('.hero-dots span');
  if (!vids.length) return;
  function showVid(i) {
    vids.forEach((v, idx) => {
      v.classList.remove('active');
      if (idx === i) { v.currentTime = 0; v.play().catch(() => {}); v.classList.add('active'); }
      else v.pause();
    });
    dots.forEach((d, idx) => d.classList.toggle('active', idx === i));
    cur = i;
  }
  function autoPlay() { clearInterval(timer); timer = setInterval(() => showVid((cur + 1) % vids.length), 7000); }
  showVid(0); autoPlay();
  dots.forEach(d => d.addEventListener('click', () => { showVid(+d.dataset.i); autoPlay(); }));
}

// FAB
const fabBtn = document.getElementById('fabBtn');
const fabMenu = document.getElementById('fabMenu');
fabBtn.addEventListener('click', () => { fabBtn.classList.toggle('active'); fabMenu.classList.toggle('open'); });
document.addEventListener('click', e => { if (!e.target.closest('.fab-wrap')) { fabBtn.classList.remove('active'); fabMenu.classList.remove('open'); } });

// Language dropdown
const langDropdown = document.getElementById('langDropdown');
langDropdown.addEventListener('click', e => { e.stopPropagation(); langDropdown.classList.toggle('open'); });
document.addEventListener('click', () => langDropdown.classList.remove('open'));
document.querySelectorAll('.lang-menu button').forEach(btn => {
  btn.addEventListener('click', e => {
    e.stopPropagation();
    applyLanguage(btn.dataset.lang);
    langDropdown.classList.remove('open');
  });
});

// Scroll reveal
const obs = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); } });
}, { threshold: 0.1, rootMargin: '0px 0px -30px 0px' });

// Active nav link
const secsInit = () => {
  const secs = document.querySelectorAll('section[id]');
  window.addEventListener('scroll', () => {
    const y = scrollY + 120;
    secs.forEach(s => {
      const l = document.querySelector(`.nav-links a[href="#${s.id}"]`);
      if (l) l.classList.toggle('active', y >= s.offsetTop && y < s.offsetTop + s.offsetHeight);
    });
  });
};

// Smooth scroll
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#"]');
  if (!a) return;
  const t = document.querySelector(a.getAttribute('href'));
  if (t) { e.preventDefault(); t.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
});

// Contact form
document.getElementById('fSubmit').addEventListener('click', async () => {
  const btn = document.getElementById('fSubmit');
  const msg = document.getElementById('fMsg');
  const t = (CONTENT.translations || DEFAULT_CONTENT.translations)[currentLang] || {};
  msg.className = 'cf-msg'; msg.textContent = '';

  const name = document.getElementById('fName').value.trim();
  if (!name) {
    msg.className = 'cf-msg error';
    msg.textContent = t.form_name || 'Name required';
    return;
  }
  btn.disabled = true;
  const payload = {
    name,
    email: document.getElementById('fEmail').value.trim() || null,
    phone: document.getElementById('fPhone').value.trim() || null,
    company: document.getElementById('fCompany').value.trim() || null,
    message: document.getElementById('fMessage').value.trim() || null
  };
  try {
    const { error } = await sb.from('contact_messages').insert(payload);
    if (error) throw error;
    msg.className = 'cf-msg success';
    msg.textContent = t.form_success || 'Sent!';
    ['fName','fEmail','fPhone','fCompany','fMessage'].forEach(id => document.getElementById(id).value = '');
  } catch (e) {
    console.error(e);
    msg.className = 'cf-msg error';
    msg.textContent = t.form_error || 'Error!';
  }
  btn.disabled = false;
});

// Bootstrap
loadContent().then(() => {
  document.querySelectorAll('.reveal').forEach(el => obs.observe(el));
  secsInit();
});
</script>
</body>
