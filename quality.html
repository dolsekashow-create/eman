<!DOCTYPE html>
<html lang="pl" dir="ltr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Eman Warsaw | Quality</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<link rel="stylesheet" href="style.css"/>
<link rel="icon" href="logo.png" type="image/png"/>
</head>
<body>
<div id="preloader"><img src="logo.png" alt="" class="loader-logo" onerror="this.style.display='none'"/></div>

<nav class="navbar" id="navbar"></nav>

<header class="page-header">
  <div class="container">
    <h1 data-key="qual_title"></h1>
    <div class="line"></div>
  </div>
</header>

<section class="section">
  <div class="container">
    <div class="qual-content">
      <p class="reveal" data-key="qual_intro"></p>

      <div class="qual-grid">
        <div class="qual-box reveal">
          <h4 data-key="qual_caco_title"></h4>
          <p class="intro" data-key="qual_caco_intro"></p>
          <ul>
            <li data-key="qual_caco_1"></li>
            <li data-key="qual_caco_2"></li>
            <li data-key="qual_caco_3"></li>
            <li data-key="qual_caco_4"></li>
            <li data-key="qual_caco_5"></li>
            <li data-key="qual_caco_6"></li>
          </ul>
        </div>
        <div class="qual-box reveal">
          <h4 data-key="qual_marble_title"></h4>
          <p class="intro" data-key="qual_marble_intro"></p>
          <ul>
            <li data-key="qual_marble_1"></li>
            <li data-key="qual_marble_2"></li>
            <li data-key="qual_marble_3"></li>
            <li data-key="qual_marble_4"></li>
            <li data-key="qual_marble_5"></li>
            <li data-key="qual_marble_6"></li>
            <li data-key="qual_marble_7"></li>
          </ul>
        </div>
      </div>

      <div class="qual-docs reveal">
        <h4 data-key="qual_docs_title"></h4>
        <div class="qual-docs-list">
          <div class="doc">Technical Data Sheet</div>
          <div class="doc">Safety Data Sheet</div>
          <div class="doc">Certificate of Analysis</div>
          <div class="doc">Commercial Invoice</div>
          <div class="doc">Packing List</div>
          <div class="doc">Certificate of Origin</div>
        </div>
      </div>

      <div class="qual-note reveal" data-key="qual_note"></div>
    </div>
  </div>
</section>

<footer class="footer" id="footer"></footer>
<div id="fab"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared.js"></script>
<script>EW.sharedInit('quality');</script>
</body>
</html>
